<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore beautiful temple images showcasing faith, peace, sacred architecture, and inspiring locations from around the world.">

    <meta name="author" content="Brain Victor Murara">

    <title>Filtered Temple Album</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"

    <!-- CSS (Updated paths to match this assignment's files) -->

    <header>
        <h1>Temple Album</h1>

        <nav>
            <ul class="navigation">

                <li><a href="#" id="old-btn">Old</a></li>
                <li><a href="#" id="new-btn">New</a></li>

    </header>

    <main>
        <!-- Dynamic Heading to show the active filter category view -->
        <h2 id="filter-heading">Home</h2>

    <footer>
