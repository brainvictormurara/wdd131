<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Submitted Successfully</title>
    <meta name="description" content="Submission confirmation and metrics log for the product review form.">
    <meta name="author" content="Brain Victor Murara">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>
</head>
<body>
    <header>
        <h1>Submission Received</h1>
    </header>

    <main>
        <div class="confirmation-box">
            <h2>Thank You!</h2>
            <p>Your product review has been logged successfully and sent to processing.</p>
            <hr style="border: 0; border-top: 1px solid var(--color-3-lightgray); margin: 1.5rem 0;">
            <p>Total reviews submitted across this browser:</p>
            <div id="review-counter" class="counter-badge">0</div>
            <p style="margin-top: 2rem;">
                <a href="form.html" class="submit-btn" style="text-decoration: none; display: inline-block;">Submit Another Review</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> | Brain Victor Murara | Zimbabwe</p>
    </footer>
</body>
</html>
